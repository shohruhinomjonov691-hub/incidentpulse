id: certbot_nginx_issue
category: tls
risk: medium
params: { domain: domains }
prerequisite: missing_certificate_or_vhost
# {domainArgs} is "-d <domain>" plus "-d www.<domain>" when the project scope sets www.
# Before approval only `nginx -t` runs here; the host runner adds static checks (vhost exists, DNS A points at this
# server, certificate missing or stale). The staging run `certonly --dry-run --nginx` is the FIRST step AFTER approval:
# the nginx authenticator edits the live nginx config and reloads nginx (twice), so it must never run without a human
# decision. If it fails, the run stops before the real issuance.
# It uses the SAME authenticator as the real run (--nginx), not --webroot. A vhost that already existed before
# IncidentPulse (for example conf.d/kervan.conf: `location / { proxy_pass ... }` and no ACME location) never serves
# /.well-known/acme-challenge from a webroot, so a --webroot staging run fails there even though the real
# `certbot --nginx` run succeeds.
dry_run:
  - [nginx, -t]
run:
  - [certbot, certonly, --dry-run, --non-interactive, --nginx, "{domainArgs}"]
  - [certbot, --nginx, "{domainArgs}", --non-interactive, --redirect]
  - [nginx, -t]
