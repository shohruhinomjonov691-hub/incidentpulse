name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  typescript:
    name: TypeScript (lint, typecheck, test)
    runs-on: ubuntu-latest
    # Real Postgres/Redis for the integration tests (they skip locally when these URLs are unset).
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_USER: incidentpulse
          POSTGRES_PASSWORD: incidentpulse_dev
          POSTGRES_DB: incidentpulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U incidentpulse" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8.8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      IT_DATABASE_URL: postgres://incidentpulse:incidentpulse_dev@127.0.0.1:5432/incidentpulse
      IT_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Test with mock LLMs ($0 API spend)
        run: pnpm test
        env:
          OPENAI_API_KEY: ""
      - name: Playwright smoke (login, incident list, live timeline)
        run: |
          pnpm --filter @incidentpulse/web exec playwright install --with-deps chromium
          pnpm --filter @incidentpulse/web smoke
      - name: Generated JSON Schema is up to date
        run: |
          pnpm generate
          git diff --exit-code -- packages/schemas/json

  python:
    name: Python (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [debate-verifier, postmortem-crew]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0 # no floating major tag is published
        with:
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.service }}/uv.lock
      - run: uv sync --locked # installs Python 3.12 from .python-version
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  compose:
    name: compose.yaml is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f compose.yaml config --quiet
      - name: compose.prod.yaml is valid and stays within the memory budget
        env:
          POSTGRES_PASSWORD: x
          REDIS_PASSWORD: x
          OPENAI_API_KEY: x
          TELEGRAM_BOT_TOKEN: x
          TELEGRAM_CHAT_ID: "1"
          TELEGRAM_ALLOWED_USER_IDS: "1"
          WEBHOOK_HMAC_SECRET: x
          DEBATE_SHARED_SECRET: x
          POSTMORTEM_SHARED_SECRET: x
          APPROVAL_HMAC_SECRET: x
          WEB_ADMIN_PASSWORD: x
          IPC_GID: "990"
          PROJECT_DOMAINS_JSON: "{}"
          PROJECT_CONTAINERS_JSON: "{}"
          PROJECT_PM2_JSON: "{}"
          PROJECT_ACTION_SCOPES_JSON: "{}"
        run: |
          docker compose -f compose.prod.yaml config --quiet
          docker compose -f compose.prod.yaml config --format json | python3 -c '
          import json, sys
          services = json.load(sys.stdin)["services"]
          total = sum(int(s["mem_limit"]) for s in services.values()) / 1048576
          published = [(n, p["host_ip"], p["published"]) for n, s in services.items() for p in s.get("ports", [])]
          assert all("mem_limit" in s and s.get("restart") == "unless-stopped" and "healthcheck" in s for s in services.values()), "mem_limit, restart and healthcheck are required"
          assert total <= 2048, f"memory budget exceeded: {total} MiB"
          assert published == [("web", "127.0.0.1", "3100")], f"only web on 127.0.0.1:3100 (default) may publish a port: {published}"
          print(f"ok: {len(services)} services, {total:.0f} MiB, published {published}")
          '
          # WEB_HOST_PORT moves the host side only (3000 is Kervan's on the production server); empty = default.
          for value in 3150 ""; do
            WEB_HOST_PORT="$value" docker compose -f compose.prod.yaml config --format json | VALUE="$value" python3 -c '
          import json, os, sys
          web = json.load(sys.stdin)["services"]["web"]["ports"]
          want = os.environ["VALUE"] or "3100"
          assert [(p["host_ip"], p["published"], p["target"]) for p in web] == [("127.0.0.1", want, 3000)], web
          print("ok: WEB_HOST_PORT=" + repr(os.environ["VALUE"]), "->", want)
          '
          done
