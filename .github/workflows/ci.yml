name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  typescript:
    name: TypeScript (lint, typecheck, test)
    runs-on: ubuntu-latest
    # Real Postgres/Redis for the integration tests (they skip locally when these URLs are unset).
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_USER: incidentpulse
          POSTGRES_PASSWORD: incidentpulse_dev
          POSTGRES_DB: incidentpulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U incidentpulse" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8.8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      IT_DATABASE_URL: postgres://incidentpulse:incidentpulse_dev@127.0.0.1:5432/incidentpulse
      IT_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Test with mock LLMs ($0 API spend)
        run: pnpm test
        env:
          OPENAI_API_KEY: ""
      - name: Generated JSON Schema is up to date
        run: |
          pnpm generate
          git diff --exit-code -- packages/schemas/json

  python:
    name: Python (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [debate-verifier, postmortem-crew]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0 # no floating major tag is published
        with:
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.service }}/uv.lock
      - run: uv sync --locked # installs Python 3.12 from .python-version
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  compose:
    name: compose.yaml is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f compose.yaml config --quiet
