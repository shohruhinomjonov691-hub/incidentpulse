# nginx vhost for the IncidentPulse web UI.   Install as:
#   /etc/nginx/sites-available/incidentpulse.gotrips.cloud.conf   (+ symlink in sites-enabled)
#
# This is the plain-HTTP starting point. Run `certbot --nginx -d incidentpulse.gotrips.cloud`
# (docs/DEPLOY.md, step 9): certbot adds the `listen 443 ssl` server block and the 80 -> 443 redirect.
# The web container listens on 127.0.0.1:3000 only (compose.prod.yaml); nothing else is exposed.

server {
    listen 80;
    listen [::]:80;
    server_name incidentpulse.gotrips.cloud;

    # certbot --webroot style challenges (certbot --nginx does not need it, renewals via webroot do)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The live timeline (SSE) and the "ask this incident" chat stream: never buffer them.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;

        client_max_body_size 64k;
    }

    # Defence in depth: the app also sets these; they survive an app bug.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
