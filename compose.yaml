# Local development only. Ports are bound to 127.0.0.1 and must never be exposed.
name: incidentpulse

services:
  postgres:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-incidentpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incidentpulse_dev}
      POSTGRES_DB: ${POSTGRES_DB:-incidentpulse}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.8-alpine
    restart: unless-stopped
    # BullMQ requires noeviction; AOF so queued incidents survive a restart.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:-incidentpulse_dev}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${REDIS_PASSWORD:-incidentpulse_dev}" --no-auth-warning ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
