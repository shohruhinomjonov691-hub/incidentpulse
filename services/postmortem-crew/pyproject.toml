[project]
name = "postmortem-crew"
version = "0.0.0"
description = "Postmortem crew: Researcher -> Reviewer -> Writer."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "crewai==1.15.44",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx2==2.16.2",
    "jsonschema==4.26.0",
    "ruff==0.17.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
